name: Build and test
on: [push, pull_request]
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: g++ -std=c++17 -Wall -Wextra -pedantic main.cpp Lander.cpp -o lander
      - run: g++ -std=c++17 -Wall -Wextra -pedantic tests/fuel_cutoff.cpp Lander.cpp -o fuel_cutoff
      - run: ./fuel_cutoff
